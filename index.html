<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jessica Collins</title>
<meta name="description" content="Jessica Collins, Los Angeles, CA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&amp;family=Quicksand:wght@400;500&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Quicksand', system-ui, sans-serif;
    color: #2E2A45;
    background: linear-gradient(180deg, #F8E7A8 0%, #F6D9B4 30%, #F2C4C4 55%, #CFC6E6 78%, #B7D2EC 100%);
    background-attachment: fixed;
  }
  main {
    position: relative;
    overflow: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 64px 6vw;
    gap: 22px;
  }
  .wash {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .wash-yellow { top: -12%; left: 10%; width: 80%; height: 55%; background: #FBE98C; opacity: 0.75; filter: blur(70px); }
  .wash-rose   { bottom: -10%; left: -12%; width: 65%; height: 55%; background: #F29BAE; opacity: 0.45; filter: blur(80px); }
  .wash-blue   { bottom: -14%; right: -10%; width: 70%; height: 60%; background: #8FB8E6; opacity: 0.6; filter: blur(80px); }
  .wash-violet { top: 28%; right: 4%; width: 36%; height: 34%; background: #C7A9E3; opacity: 0.4; filter: blur(70px); }
  h1, p { position: relative; margin: 0; }
  h1 {
    font-family: 'Comfortaa', sans-serif;
    font-weight: 300;
    font-size: clamp(40px, 8vw, 104px);
    line-height: 1.08;
    letter-spacing: -0.01em;
  }
  .location {
    font-size: clamp(14px, 1.5vw, 17px);
    font-weight: 500;
    letter-spacing: 0.14em;
    color: #4A4263;
  }
  .email {
    font-size: clamp(17px, 2vw, 22px);
    font-weight: 500;
    line-height: 1.5;
  }
  .email a {
    color: #2E2A45;
    text-decoration: none;
    border-bottom: 2px solid #6B4E8F;
    padding-bottom: 2px;
    overflow-wrap: anywhere;
  }
  .email a:hover { color: #6B4E8F; }
  .email a:focus-visible { outline: 3px solid #6B4E8F; outline-offset: 4px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <div class="wash wash-yellow"></div>
  <div class="wash wash-rose"></div>
  <div class="wash wash-blue"></div>
  <div class="wash wash-violet"></div>
  <h1>Jessica Collins</h1>
  <p class="location">Los Angeles, CA</p>
  <p class="email"><a href="mailto:hello@jessicacollins.io">hello@jessicacollins.io</a></p>
</main>
</body>
</html>
